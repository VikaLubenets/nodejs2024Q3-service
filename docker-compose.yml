version: '3.8'
services:

  dev-db:
    image: postgres:13
    restart: always
    environment:
      POSTGRES_DB: nest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    ports:
      - "5432:5432" 

  app:
    build: .
    ports:
      - '4000:4000'
    depends_on:
      - dev-db
    env_file:
      - .env
